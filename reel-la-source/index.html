<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La Source — reel</title>
<style>
@font-face{font-family:'Fredoka';font-weight:700;src:url(assets/Fredoka-700.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(assets/SpaceGrotesk-700.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(assets/IBMPlexMono-500.woff2) format('woff2')}
html,body{margin:0;padding:0;background:#0A0A0F;overflow:hidden}
#stage{display:block}
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<!-- DÉCOR : nuit de film noir (bleus nuit → sarcelle, jamais de violet/rose : sûr pour l'incrustation) -->
<linearGradient id="skyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1920">
<stop offset="0" stop-color="#070B1C"></stop>
<stop offset="0.38" stop-color="#0C1A33"></stop>
<stop offset="0.66" stop-color="#123248"></stop>
<stop offset="0.8" stop-color="#17404F"></stop>
<stop offset="1" stop-color="#0B1B26"></stop>
</linearGradient>
<radialGradient id="moonHalo" gradientUnits="userSpaceOnUse" cx="900" cy="150" r="330">
<stop offset="0" stop-color="#4DFF8F" stop-opacity="0.32"></stop>
<stop offset="0.3" stop-color="#3FD0B0" stop-opacity="0.12"></stop>
<stop offset="1" stop-color="#3FD0B0" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="moonDisc" gradientUnits="userSpaceOnUse" cx="884" cy="136" r="78">
<stop offset="0" stop-color="#F4FFF7"></stop>
<stop offset="0.7" stop-color="#D2FBE2"></stop>
<stop offset="1" stop-color="#A8EFC8"></stop>
</radialGradient>
<radialGradient id="cityGlow" gradientUnits="userSpaceOnUse" cx="540" cy="1520" r="760">
<stop offset="0" stop-color="#D4A64A" stop-opacity="0.22"></stop>
<stop offset="0.45" stop-color="#2A8C8C" stop-opacity="0.12"></stop>
<stop offset="1" stop-color="#2A8C8C" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="blindGrad" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#BFF6FF" stop-opacity="0"></stop>
<stop offset="0.5" stop-color="#BFF6FF" stop-opacity="1"></stop>
<stop offset="1" stop-color="#BFF6FF" stop-opacity="0"></stop>
</linearGradient>
<linearGradient id="streetFade" gradientUnits="userSpaceOnUse" x1="0" y1="1560" x2="0" y2="1920">
<stop offset="0" stop-color="#060A12" stop-opacity="0"></stop>
<stop offset="1" stop-color="#05080F" stop-opacity="0.95"></stop>
</linearGradient>
<radialGradient id="dustGrad">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="1"></stop>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
</radialGradient>

<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="3" result="b"></feGaussianBlur>
<feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
</filter>
<filter id="subShadow" x="-20%" y="-40%" width="140%" height="180%">
<feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"></feDropShadow>
</filter>
<filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
<feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
</filter>

<!-- EFFET DESSIN : contours qui tremblent + grain papier (robot uniquement) -->
<filter id="drawFx" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920" color-interpolation-filters="sRGB">
<feTurbulence id="dfTurb" type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="1" result="n"></feTurbulence>
<feDisplacementMap id="dfDisp" in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap>
<feTurbulence id="dfGrain" type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="7" result="g"></feTurbulence>
<feColorMatrix in="g" type="matrix" values="0 0 0 0 0.97  0 0 0 0 0.93  0 0 0 0 0.84  5 0 0 0 -2.85" result="gl"></feColorMatrix>
<feColorMatrix in="g" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0 0.05  -5 0 0 0 2.15" result="gd"></feColorMatrix>
<feMerge result="gm"><feMergeNode in="gl"></feMergeNode><feMergeNode in="gd"></feMergeNode></feMerge>
<feComposite in="gm" in2="d" operator="in" result="gin"></feComposite>
<feComponentTransfer in="gin" result="gin2"><feFuncA id="dfGrainA" type="linear" slope="0.3"></feFuncA></feComponentTransfer>
<feMerge><feMergeNode in="d"></feMergeNode><feMergeNode in="gin2"></feMergeNode></feMerge>
</filter>

<!-- EFFET PIXEL : un échantillon par bloc, dilaté -->
<filter id="pixFx" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920" color-interpolation-filters="sRGB">
<feGaussianBlur id="pxBlur" in="SourceGraphic" stdDeviation="5" result="bl"></feGaussianBlur>
<feFlood id="pxFlood" x="11" y="11" width="1" height="1" flood-color="#000000" flood-opacity="1" result="dot"></feFlood>
<feComposite id="pxCell" in="dot" in2="dot" operator="over" x="0" y="0" width="22" height="22" result="cell"></feComposite>
<feTile in="cell" result="grid"></feTile>
<feComposite in="bl" in2="grid" operator="in" result="samp"></feComposite>
<feMorphology id="pxMorph" in="samp" operator="dilate" radius="11"></feMorphology>
</filter>

<!-- découpes des médias intégrés -->
<clipPath id="clipScreen" clipPathUnits="userSpaceOnUse"><rect x="60" y="440" width="960" height="640" rx="143"></rect></clipPath>
<clipPath id="clipVideo" clipPathUnits="userSpaceOnUse"><rect x="2" y="422" width="1076" height="716" rx="27"></rect></clipPath>
<clipPath id="clipPol2" clipPathUnits="userSpaceOnUse"><rect x="90" y="480" width="900" height="600" rx="16"></rect></clipPath>
<clipPath id="clipPol5" clipPathUnits="userSpaceOnUse"><rect x="70" y="330" width="400" height="500" rx="16"></rect></clipPath>
<clipPath id="clipSite" clipPathUnits="userSpaceOnUse"><path d="M 22 501 H 1058 V 1063 Q 1058 1084 1037 1084 H 43 Q 22 1084 22 1063 Z"></path></clipPath>
